services:
  - type: web
    name: inventra
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        database:
          name: inventra_db
          plan: free
          engine: postgres
          version: 15

databases:
  - name: inventra_db
    engine: postgres
    plan: free
    version: 15
