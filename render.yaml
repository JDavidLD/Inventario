services:
  - type: web
    name: inventra
    env: python
    plan: free
    pythonVersion: 3.11
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        database:
          name: inventra_db
          plan: free
          engine: postgres
          version: 15
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"

databases:
  - name: inventra_db
    engine: postgres
    plan: free
    version: 15
